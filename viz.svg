<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">FEWEST jumps to the end of [2,3,1,1,4]. Think BFS: one jump explores a contiguous</text>
<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">WINDOW of indexes; the next window is everything reachable from the current one.</text>
